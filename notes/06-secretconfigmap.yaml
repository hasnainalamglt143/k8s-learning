# 06 - ConfigMaps & Secrets

## Why
One image for all environments; inject config at runtime.
Django reads via os.environ.get("DB_HOST")
- ConfigMap → non-sensitive settings (DEBUG, DB_HOST, config files)
- Secret → sensitive (passwords, API keys, tokens, certs)

## ConfigMap YAML
apiVersion: v1
kind: ConfigMap
metadata:
  name: django-config
data:
  DEBUG: "False"        # values must be strings → quote them
  DB_HOST: "postgres"
  app.conf: |           # multi-line = whole file
    log_level=info

## Create imperatively
kubectl create configmap X --from-literal=K=V
kubectl create configmap X --from-file=nginx.conf
kubectl create configmap X --from-env-file=.env

## 3 ways to use (same for Secrets)
1. Single key → env:  valueFrom.configMapKeyRef / secretKeyRef
2. All keys → env:    envFrom.configMapRef / secretRef
3. As files:          volumes.configMap.name / volumes.secret.secretName + volumeMounts
- volumeMounts = inside container; volumes = pod level

## Updates
- Env vars: read at container start → NOT updated → `kubectl rollout restart deployment X`
- Mounted files: auto-update after a short delay

## Secret YAML
apiVersion: v1
kind: Secret
metadata:
  name: django-secret
type: Opaque
stringData:            # plain text, K8s encodes it
  DB_PASSWORD: "..."
# data: requires base64 values yourself

## Security facts
- Secrets are base64-ENCODED, NOT encrypted
- Secure them with: encryption at rest (etcd), RBAC, external secret manager
- Benefits vs ConfigMap: separate RBAC, can be encrypted at rest, hidden in describe, tmpfs mount
- Never commit real secrets to Git → Sealed Secrets / External Secrets Operator / Vault

## Secret types
- Opaque (generic)
- kubernetes.io/dockerconfigjson → private registry → spec.imagePullSecrets
- kubernetes.io/tls → HTTPS certs (Ingress)

## Commands
kubectl get cm / secrets
kubectl describe cm X
kubectl get secret X -o yaml
kubectl get secret X -o jsonpath="{.data.KEY}"   # then base64 decode
kubectl create secret generic X --from-literal=K=V
kubectl create secret docker-registry X --docker-server=... --docker-username=... --docker-password=...